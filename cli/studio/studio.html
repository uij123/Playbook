<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Playbooks Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f1216; --panel: #161b22; --card: #1c232c;
    --line: #2b3440; --text: #e6edf3; --dim: #8b98a5; --accent: #4da3ff;
    --judge: #e3b341; --capture: #58a6ff; --loop: #bc8cff; --stop: #f0883e;
    --ok: #3fb950; --fail: #f85149;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, "SF Pro Text", sans-serif; height: 100vh; display: flex; overflow: hidden; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  #sidebar { width: 300px; min-width: 300px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  #sidebar h1 { font-size: 15px; padding: 14px 16px 10px; letter-spacing: .3px; }
  #sidebar h1 span { color: var(--dim); font-weight: 400; }
  #library { overflow-y: auto; flex: 1; padding: 0 8px 12px; }
  .pb-card { padding: 10px 10px 8px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; cursor: pointer; background: var(--card); }
  .pb-card:hover { border-color: var(--accent); }
  .pb-card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .pb-card .nm { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .pb-card .ds { color: var(--dim); font-size: 12px; margin: 3px 0 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .badges { display: flex; gap: 5px; flex-wrap: wrap; }
  .badge { font-size: 10.5px; padding: 1px 7px; border-radius: 10px; background: #22303e; color: var(--dim); }
  .badge.det { background: #16311f; color: var(--ok); }
  .badge.jdg { background: #3a2f13; color: var(--judge); }
  .badge.sec { background: #33222e; color: #e18cc0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.ok { background: var(--ok); } .dot.fail { background: var(--fail); } .dot.none { background: #444c56; }

  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #topbar .title { font-size: 16px; font-weight: 700; margin-right: 4px; }
  #detmeter { font-size: 11px; color: var(--dim); text-align: right; margin-left: auto; }
  #detmeter b { color: var(--ok); }
  button { background: #22303e; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: #1f6feb; border-color: #1f6feb; }
  button.run { background: #238636; border-color: #238636; }
  button.mini { padding: 1px 7px; font-size: 11px; background: transparent; border-color: transparent; color: var(--dim); }
  button.mini:hover { color: var(--text); border-color: var(--line); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; color: var(--dim); padding: 5px 12px; }
  .seg button.on { background: #22303e; color: var(--text); }

  #editor { flex: 1; overflow-y: auto; padding: 18px 22px 80px; }
  #empty { color: var(--dim); padding: 60px; text-align: center; }

  /* ---------- Flow view ---------- */
  #flow { max-width: 640px; margin: 0 auto; }
  .head-card { background: linear-gradient(180deg, #1b2330, #171d26); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px 14px; }
  .head-card h2 { font-size: 18px; margin-bottom: 2px; }
  .head-card .lbl { font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .6px; margin: 10px 0 4px; }
  .head-card textarea { width: 100%; background: #12161c; border: 1px solid var(--line); border-radius: 7px; color: var(--text); padding: 8px 10px; font: 13px/1.5 inherit; resize: vertical; min-height: 56px; }
  .appchips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .appchip { font-size: 11.5px; padding: 2px 10px; border-radius: 12px; background: #22303e; color: var(--text); }

  .conn { display: flex; flex-direction: column; align-items: center; color: #55606c; }
  .conn .bar { width: 2px; height: 16px; background: #3a4450; }
  .conn .tip { font-size: 10px; margin-top: -2px; }
  .conn .why { font-size: 10.5px; color: var(--dim); margin: 1px 0; }

  .stage { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 10px; position: relative; }
  .stage.loop { border-color: #4a3f6b; box-shadow: 0 0 0 1px #4a3f6b40; }
  .stage-top { display: flex; align-items: center; gap: 10px; }
  .stage-num { min-width: 26px; height: 26px; border-radius: 50%; background: #22303e; color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 700; }
  .stage.loop .stage-num { color: var(--loop); }
  .stage-title { flex: 1; background: transparent; border: 1px solid transparent; border-radius: 6px; color: var(--text); font-size: 15px; font-weight: 700; padding: 3px 7px; }
  .stage-title:hover, .stage-title:focus { border-color: var(--line); background: #12161c; outline: none; }
  .stage-sum { width: 100%; background: transparent; border: 1px solid transparent; border-radius: 6px; color: var(--dim); font: 12.8px/1.5 inherit; padding: 4px 7px; margin: 4px 0 0 36px; width: calc(100% - 36px); resize: none; overflow: hidden; }
  .stage-sum:hover, .stage-sum:focus { border-color: var(--line); background: #12161c; color: var(--text); outline: none; }
  .stage-chips { display: flex; gap: 5px; flex-wrap: wrap; margin: 8px 0 2px 36px; align-items: center; }
  .stage-chips .badge.loopb { background: #2b2440; color: var(--loop); }
  .stage-chips .badge.stopb { background: #3a2313; color: var(--stop); }
  .stage-chips .badge.visb { background: #16283a; color: var(--capture); }
  .stage-foot { margin: 6px 0 0 36px; }
  .stage-kids { margin: 10px 0 4px 10px; padding: 8px 0 0 10px; border-left: 2px dashed #3a4450; }

  .gatewrap { display: flex; align-items: stretch; justify-content: center; gap: 0; margin: 2px 0; }
  .gate-left { display: flex; flex-direction: column; align-items: center; width: 50%; }
  .gate-d { color: var(--judge); font-size: 12px; border: 1px solid var(--judge); padding: 3px 12px; border-radius: 8px; background: #241f10; transform: none; margin: 4px 0; }
  .gate-arm { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--dim); }
  .endpill { border: 1px solid var(--stop); color: var(--stop); background: #241408; border-radius: 16px; padding: 4px 14px; font-size: 12px; white-space: nowrap; align-self: center; margin-left: 10px; }

  /* ---------- Brick (detail) view ---------- */
  .step { background: var(--card); border: 1px solid var(--line); border-left: 4px solid #3d4854; border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; }
  .step.judge { border-left-color: var(--judge); }
  .step.capture { border-left-color: var(--capture); }
  .step.foreach { border-left-color: var(--loop); }
  .step.stopk { border-left-color: var(--stop); }
  .step-head { display: flex; align-items: center; gap: 8px; }
  .glyph { font-size: 13px; width: 18px; text-align: center; }
  .kind { font-size: 10.5px; color: var(--dim); min-width: 86px; }
  .intent { flex: 1; background: transparent; border: 1px solid transparent; border-radius: 5px; color: var(--text); font-size: 13.5px; font-weight: 600; padding: 3px 6px; }
  .intent:hover, .intent:focus { border-color: var(--line); background: #12161c; outline: none; }
  .ctrl { display: flex; gap: 2px; opacity: .35; }
  .step:hover .ctrl { opacity: 1; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 6px; margin-top: 8px; }
  .fields.wide { grid-template-columns: 1fr; }
  label.f { display: flex; flex-direction: column; gap: 2px; font-size: 10.5px; color: var(--dim); }
  label.f input, label.f select, label.f textarea { background: #12161c; border: 1px solid var(--line); border-radius: 5px; color: var(--text); padding: 5px 7px; font-size: 12.5px; font-family: inherit; }
  label.f textarea { min-height: 64px; resize: vertical; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .choices { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .choice-chip { border: 1px solid var(--judge); color: var(--judge); border-radius: 12px; padding: 1px 10px; font-size: 11.5px; }
  .diamond { color: var(--judge); }
  .kids { margin: 8px 0 2px 26px; padding-left: 12px; border-left: 2px dashed #4a3f6b; }
  .adder { text-align: center; margin: 2px 0 8px; }
  .adder select { background: #161b22; color: var(--dim); border: 1px dashed var(--line); border-radius: 6px; padding: 3px 8px; font-size: 11.5px; }

  #drawer { border-top: 1px solid var(--line); background: #0c0f13; height: 0; transition: height .15s; overflow: hidden; display: flex; flex-direction: column; }
  #drawer.open { height: 300px; }
  #drawer .dhead { display: flex; gap: 14px; padding: 6px 14px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--dim); align-items: center; }
  #console { flex: 1; overflow-y: auto; padding: 10px 14px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: pre-wrap; color: #c9d1d9; }
  #history { flex: 1; overflow-y: auto; padding: 10px 14px; display: none; font-size: 12.5px; }
  .runrow { display: flex; gap: 10px; padding: 4px 6px; border-radius: 5px; cursor: pointer; }
  .runrow:hover { background: #161b22; }
  #toast { position: fixed; bottom: 18px; right: 18px; background: #22303e; border: 1px solid var(--line); padding: 9px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 460px; z-index: 10; }
  #toast.show { opacity: 1; }
  .hint { font-size: 11.5px; color: var(--dim); text-align: center; margin: 8px 0 12px; }
</style>
</head>
<body>
  <div id="sidebar">
    <h1>▶ Playbooks <span>Studio</span></h1>
    <div id="library"></div>
  </div>
  <div id="main">
    <div id="topbar">
      <div class="title" id="t-name">—</div>
      <div class="seg">
        <button id="v-flow" class="on">Flow</button>
        <button id="v-bricks">Details</button>
      </div>
      <button id="btn-desc" title="Let the model draft the plain-language description and stage titles — it never changes the steps themselves">✨ Describe</button>
      <div id="detmeter"></div>
      <button id="btn-hist">History</button>
      <button class="primary" id="btn-save">Save</button>
      <button class="run" id="btn-run">Run ▷</button>
    </div>
    <div id="editor"><div id="empty">Select a playbook</div></div>
    <div id="drawer">
      <div class="dhead">
        <span id="d-title">console</span>
        <span style="flex:1"></span>
        <button class="mini" onclick="closeDrawer()">✕ close</button>
      </div>
      <div id="console"></div>
      <div id="history"></div>
    </div>
  </div>
  <div id="toast"></div>

<script>
let LIB = [];        // library entries
let FILE = null;     // selected file
let PB = null;       // working playbook object
let VIEW = "flow";  // "flow" | "bricks"
let EXPANDED = new Set();  // stage indexes with details open
let AUTO_STAGED = false;   // stages were heuristically generated (unsaved)

const KINDS = ["app.activate","ui.click","ui.type","ui.key","wait","capture","judge","foreach","stop"];
const GLYPH = { "app.activate":"⬈", "ui.click":"◉", "ui.type":"⌨", "ui.key":"⌘", "wait":"⏱", "capture":"⤓", "judge":"◇", "foreach":"↻", "stop":"⏹" };
const CLASS = { "judge":"judge", "capture":"capture", "foreach":"foreach", "stop":"stopk" };

function toast(msg, ms=2600) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), ms);
}

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch])); }

async function loadLibrary(keepSel) {
  LIB = await (await fetch("/api/playbooks")).json();
  const el = document.getElementById("library");
  el.innerHTML = "";
  for (const p of LIB) {
    const c = document.createElement("div");
    c.className = "pb-card" + (p.file === FILE ? " sel" : "");
    const dot = p.lastRun ? (p.lastRun.result === "ok" ? "ok" : "fail") : "none";
    c.innerHTML = `
      <div class="nm"><span class="dot ${dot}"></span>${esc(p.name)}</div>
      <div class="ds">${esc(p.description || "")}</div>
      <div class="badges">
        <span class="badge">${p.steps} steps</span>
        ${p.judges ? `<span class="badge jdg">◇ ${p.judges} judge${p.judges>1?"s":""}</span>` : ""}
        <span class="badge det">${p.determinism}% deterministic</span>
        ${p.secrets.length ? `<span class="badge sec">🔒 ${p.secrets.length}</span>` : ""}
        ${p.runCount ? `<span class="badge">${p.runCount} runs</span>` : ""}
      </div>`;
    c.onclick = () => openPlaybook(p.file);
    el.appendChild(c);
  }
  if (keepSel && FILE) markSel();
}

function markSel() {
  document.querySelectorAll(".pb-card").forEach((c, i) => c.classList.toggle("sel", LIB[i]?.file === FILE));
}

async function openPlaybook(file) {
  FILE = file;
  PB = await (await fetch(`/api/playbook?f=${encodeURIComponent(file)}`)).json();
  EXPANDED = new Set();
  AUTO_STAGED = false;
  if (!PB.stages || !PB.stages.length) { PB.stages = autoStages(PB.steps); AUTO_STAGED = true; }
  markSel();
  render();
}

// ---------- stage machinery ----------

// Heuristic grouping for playbooks that have no stages yet: cut before each
// app switch, and give every loop its own stage. ✨ Describe refines the text.
function autoStages(steps) {
  const groups = [];
  let cur = [];
  for (const s of steps) {
    if ((s.do === "app.activate" || s.do === "foreach") && cur.length) { groups.push(cur); cur = []; }
    cur.push(s);
    if (s.do === "foreach") { groups.push(cur); cur = []; }
  }
  if (cur.length) groups.push(cur);
  return groups.map(g => {
    const fe = g.find(s => s.do === "foreach");
    const title = fe ? `For each ${fe.as || "item"}` : (g[0].intent || g[0].id);
    return { title, summary: "", until: g[g.length - 1].id };
  });
}

// Resolve stages to index ranges over PB.steps, robust to edits: each stage
// ends at the first occurrence of its `until` after the previous cut; anything
// left over becomes a synthetic tail stage.
function stageRanges() {
  const ranges = [];
  let from = 0;
  for (const st of PB.stages || []) {
    let to = -1;
    for (let i = from; i < PB.steps.length; i++) if (PB.steps[i].id === st.until) { to = i + 1; break; }
    if (to === -1) continue; // until not found (deleted step) — stage dissolves into the next
    ranges.push({ st, from, to });
    from = to;
  }
  if (from < PB.steps.length) {
    ranges.push({ st: { title: "Wrap up", summary: "", until: PB.steps[PB.steps.length - 1].id, _tail: true }, from, to: PB.steps.length });
  }
  return ranges;
}

function rangeInfo(from, to) {
  const apps = [], info = { steps: 0, judges: 0, vision: false, loop: null, gate: null };
  const walk = (arr) => {
    for (const s of arr) {
      info.steps++;
      if (s.do === "judge") info.judges++;
      if (s.do === "capture" && s.capture?.scope === "screenshot") info.vision = true;
      const a = s.target?.app;
      if (a && !a.includes("{{") && !apps.includes(a)) apps.push(a);
      if (s.steps) walk(s.steps);
    }
  };
  for (let i = from; i < to; i++) {
    const s = PB.steps[i];
    if (s.do === "foreach") info.loop = s;
    if (s.do === "stop") info.gate = s;
    walk([s]);
  }
  info.apps = apps;
  return info;
}

function allApps() {
  const apps = [];
  const walk = (arr) => { for (const s of arr) { const a = s.target?.app; if (a && !a.includes("{{") && !apps.includes(a)) apps.push(a); if (s.steps) walk(s.steps); } };
  walk(PB.steps);
  return apps;
}

function detStats(steps) {
  let total = 0, judges = 0;
  for (const s of steps || []) {
    total++; if (s.do === "judge") judges++;
    if (s.steps) { const i = detStats(s.steps); total += i.total; judges += i.judges; }
  }
  return { total, judges };
}

function prettyVar(v) { return String(v || "").split(".")[0].replace(/_/g, " "); }

// ---------- rendering ----------

function render() {
  document.getElementById("t-name").textContent = PB.playbook;
  const d = detStats(PB.steps);
  document.getElementById("detmeter").innerHTML =
    `<b>${d.total ? Math.round((d.total-d.judges)/d.total*100) : 100}%</b> deterministic<br>${d.judges} decision${d.judges===1?"":"s"} of ${d.total} steps`;
  document.getElementById("v-flow").classList.toggle("on", VIEW === "flow");
  document.getElementById("v-bricks").classList.toggle("on", VIEW === "bricks");
  const ed = document.getElementById("editor");
  ed.innerHTML = "";
  if (VIEW === "flow") ed.appendChild(renderFlow());
  else ed.appendChild(renderRange(PB.steps, 0, PB.steps.length));
}

function renderFlow() {
  const flow = document.createElement("div");
  flow.id = "flow";

  // header: what this flow does
  const head = document.createElement("div");
  head.className = "head-card";
  head.innerHTML = `<h2>${esc(PB.playbook)}</h2><div class="lbl">What this flow does</div>`;
  const desc = document.createElement("textarea");
  desc.value = PB.description || "";
  desc.placeholder = "Explain the whole flow in a sentence or two — or press ✨ Describe.";
  desc.onchange = () => { PB.description = desc.value; };
  head.appendChild(desc);
  const chips = document.createElement("div");
  chips.className = "appchips";
  chips.innerHTML = allApps().map(a => `<span class="appchip">${esc(a)}</span>`).join("");
  head.appendChild(chips);
  flow.appendChild(head);

  if (AUTO_STAGED) {
    const h = document.createElement("div");
    h.className = "hint";
    h.textContent = "Steps were grouped automatically — press ✨ Describe for proper titles & summaries, then Save.";
    flow.appendChild(h);
  }

  const ranges = stageRanges();
  ranges.forEach((r, k) => {
    flow.appendChild(connector(null));
    flow.appendChild(renderStage(r, k, ranges.length));
    const info = rangeInfo(r.from, r.to);
    if (info.gate && info.gate.if_empty) flow.appendChild(renderGate(info.gate, k === ranges.length - 1));
  });

  const done = document.createElement("div");
  done.style.cssText = "text-align:center;color:var(--dim);font-size:12px;margin-top:2px";
  done.textContent = "— done —";
  flow.appendChild(connector(null));
  flow.appendChild(done);
  return flow;
}

function connector(label) {
  const c = document.createElement("div");
  c.className = "conn";
  c.innerHTML = `<div class="bar"></div>${label ? `<div class="why">${esc(label)}</div><div class="bar"></div>` : ""}<div class="tip">▼</div>`;
  return c;
}

function renderStage(r, k, count) {
  const info = rangeInfo(r.from, r.to);
  const card = document.createElement("div");
  card.className = "stage" + (info.loop ? " loop" : "");

  const top = document.createElement("div");
  top.className = "stage-top";
  const num = document.createElement("div");
  num.className = "stage-num";
  num.textContent = info.loop ? "↻" : String(k + 1);
  top.appendChild(num);
  const title = document.createElement("input");
  title.className = "stage-title";
  title.value = r.st.title;
  title.onchange = () => { r.st.title = title.value; if (r.st._tail) materializeTail(r.st); };
  top.appendChild(title);
  const ctrl = document.createElement("div");
  ctrl.className = "ctrl";
  if (!r.st._tail && count > 1) {
    const del = document.createElement("button");
    del.className = "mini"; del.textContent = "✕"; del.title = "merge this box into the next one";
    del.onclick = () => { PB.stages.splice(PB.stages.indexOf(r.st), 1); render(); };
    ctrl.appendChild(del);
  }
  top.appendChild(ctrl);
  card.appendChild(top);

  const sum = document.createElement("textarea");
  sum.className = "stage-sum";
  sum.rows = 1;
  sum.value = r.st.summary || "";
  sum.placeholder = "What happens in this box, in plain words…";
  const grow = () => { sum.style.height = "auto"; sum.style.height = sum.scrollHeight + "px"; };
  sum.oninput = grow;
  sum.onchange = () => { r.st.summary = sum.value; if (r.st._tail) materializeTail(r.st); };
  card.appendChild(sum);
  requestAnimationFrame(grow);

  const chips = document.createElement("div");
  chips.className = "stage-chips";
  const parts = [];
  if (info.loop) parts.push(`<span class="badge loopb">🔁 repeats for each ${esc(info.loop.as || "item")} — until none left</span>`);
  if (info.gate && info.gate.if_empty) parts.push(`<span class="badge stopb">⏹ stops if no ${esc(prettyVar(info.gate.if_empty))}</span>`);
  if (info.judges) parts.push(`<span class="badge jdg">◇ ${info.judges} decision${info.judges>1?"s":""}</span>`);
  if (info.vision) parts.push(`<span class="badge visb">📷 reads an image</span>`);
  parts.push(...info.apps.map(a => `<span class="badge">${esc(a)}</span>`));
  chips.innerHTML = parts.join("");
  chips.insertAdjacentHTML("beforeend", `<span style="flex:1"></span>`);
  card.appendChild(chips);

  const foot = document.createElement("div");
  foot.className = "stage-foot";
  const tog = document.createElement("button");
  tog.className = "mini";
  const n = r.to - r.from;
  tog.textContent = (EXPANDED.has(k) ? "▾ hide" : "▸ show") + ` the ${n} detailed step${n>1?"s":""}`;
  tog.onclick = () => { EXPANDED.has(k) ? EXPANDED.delete(k) : EXPANDED.add(k); render(); };
  foot.appendChild(tog);
  card.appendChild(foot);

  if (EXPANDED.has(k)) {
    const kids = document.createElement("div");
    kids.className = "stage-kids";
    kids.appendChild(renderRange(PB.steps, r.from, r.to));
    card.appendChild(kids);
  }
  return card;
}

// Editing the synthetic tail stage turns it into a real one.
function materializeTail(st) {
  delete st._tail;
  PB.stages = PB.stages || [];
  PB.stages.push(st);
}

function renderGate(gateStep, isLast) {
  const wrap = document.createElement("div");
  wrap.className = "gatewrap";
  const left = document.createElement("div");
  left.className = "gate-left";
  left.innerHTML = `
    <div class="conn"><div class="bar"></div></div>
    <div class="gate-d">◇ any ${esc(prettyVar(gateStep.if_empty))}?</div>
    <div class="gate-arm">${isLast ? "" : "yes — keep going ↓"}</div>`;
  wrap.appendChild(left);
  const pill = document.createElement("div");
  pill.className = "endpill";
  pill.textContent = "none → ⏹ end run — nothing to do";
  wrap.appendChild(pill);
  return wrap;
}

// ---------- brick (detail) editor ----------

function renderRange(arr, from, to) {
  const wrap = document.createElement("div");
  for (let i = from; i < to; i++) {
    wrap.appendChild(renderStep(arr[i], arr, i));
    wrap.appendChild(adder(arr, i + 1));
  }
  if (to === from) wrap.appendChild(adder(arr, from));
  return wrap;
}

function adder(arr, at) {
  const a = document.createElement("div");
  a.className = "adder";
  const sel = document.createElement("select");
  sel.innerHTML = `<option value="">+ add step…</option>` + KINDS.map(k => `<option>${k}</option>`).join("");
  sel.onchange = () => {
    if (!sel.value) return;
    arr.splice(at, 0, templateStep(sel.value, arr));
    render();
  };
  a.appendChild(sel);
  return a;
}

function templateStep(kind, arr) {
  const id = "n" + Math.random().toString(36).slice(2, 6);
  const base = { id, intent: "New " + kind + " step", do: kind };
  if (kind === "app.activate") base.target = { app: "TextEdit" };
  if (kind === "ui.click") base.target = { app: "", a11y: { role: "AXButton", title: "" } };
  if (kind === "ui.type") base.value = "";
  if (kind === "ui.key") base.value = "cmd+n";
  if (kind === "wait") base.value = "500";
  if (kind === "capture") { base.target = { app: "", a11y: { role: "AXWindow" } }; base.capture = { into: "captured", scope: "subtree" }; }
  if (kind === "judge") { base.prompt = "Describe the decision…"; base.input_vars = []; base.into = "result"; base.output = "text"; }
  if (kind === "foreach") { base.items = "{{list}}"; base.as = "item"; base.steps = []; }
  if (kind === "stop") { base.intent = "If nothing was found, stop here"; base.if_empty = ""; }
  return base;
}

function f(labelText, value, onch, opts) {
  const l = document.createElement("label");
  l.className = "f";
  l.textContent = labelText;
  let inp;
  if (opts && opts.select) {
    inp = document.createElement("select");
    inp.innerHTML = opts.select.map(o => `<option ${o===value?"selected":""}>${o}</option>`).join("");
  } else if (opts && opts.area) {
    inp = document.createElement("textarea");
    inp.value = value ?? "";
  } else {
    inp = document.createElement("input");
    inp.value = value ?? "";
    if (opts && opts.ph) inp.placeholder = opts.ph;
  }
  inp.onchange = () => onch(inp.value);
  l.appendChild(inp);
  return l;
}

function renderStep(step, arr, idx) {
  const card = document.createElement("div");
  card.className = "step " + (CLASS[step.do] || "");
  const head = document.createElement("div");
  head.className = "step-head";
  head.innerHTML = `<span class="glyph ${step.do==="judge"?"diamond":""}">${GLYPH[step.do] || "•"}</span>
    <span class="kind mono">${step.id}<br>${step.do}</span>`;
  const intent = document.createElement("input");
  intent.className = "intent";
  intent.value = step.intent || "";
  intent.onchange = () => { step.intent = intent.value; };
  head.appendChild(intent);
  const ctrl = document.createElement("div");
  ctrl.className = "ctrl";
  const mk = (t, fn) => { const b = document.createElement("button"); b.className = "mini"; b.textContent = t; b.onclick = fn; return b; };
  ctrl.appendChild(mk("↑", () => { if (idx>0){ arr.splice(idx-1,0,arr.splice(idx,1)[0]); render(); } }));
  ctrl.appendChild(mk("↓", () => { if (idx<arr.length-1){ arr.splice(idx+1,0,arr.splice(idx,1)[0]); render(); } }));
  ctrl.appendChild(mk("✕", () => { arr.splice(idx,1); render(); }));
  head.appendChild(ctrl);
  card.appendChild(head);

  const fields = document.createElement("div");
  fields.className = "fields" + (step.do === "judge" ? " wide" : "");

  if (["ui.type","ui.key","wait"].includes(step.do)) {
    fields.appendChild(f(step.do === "wait" ? "milliseconds" : "value (variables ok: {{name}})", step.value, v => step.value = v));
  }
  if (step.do === "stop") {
    fields.appendChild(f("stop only when this variable is empty (blank = always stop)", step.if_empty, v => step.if_empty = v || undefined, { ph: "found_items" }));
  }
  if (step.target || ["ui.click","ui.type","capture","app.activate"].includes(step.do)) {
    step.target = step.target || {};
    fields.appendChild(f("app", step.target.app, v => step.target.app = v || undefined));
    if (step.do !== "app.activate") {
      step.target.a11y = step.target.a11y || { role: "" };
      fields.appendChild(f("element role (* = any)", step.target.a11y.role, v => step.target.a11y.role = v));
      fields.appendChild(f("element title", step.target.a11y.title, v => step.target.a11y.title = v || undefined));
      fields.appendChild(f("element description", step.target.a11y.description, v => step.target.a11y.description = v || undefined));
      fields.appendChild(f("window title contains", step.target.window && step.target.window.title_contains,
        v => step.target.window = v ? { title_contains: v } : undefined));
    }
  }
  if (step.do === "capture") {
    step.capture = step.capture || { into: "" };
    fields.appendChild(f("store into variable", step.capture.into, v => step.capture.into = v));
    fields.appendChild(f("scope", step.capture.scope || "element", v => step.capture.scope = v,
      { select: ["element","subtree","screenshot"] }));
  }
  if (step.do === "judge") {
    fields.appendChild(f("prompt (the decision, spelled out)", step.prompt, v => step.prompt = v, { area: true }));
    const row = document.createElement("div");
    row.className = "fields";
    row.appendChild(f("input variables (comma-sep)", (step.input_vars||[]).join(", "),
      v => step.input_vars = v.split(",").map(s=>s.trim()).filter(Boolean)));
    row.appendChild(f("store into", step.into, v => step.into = v));
    row.appendChild(f("output", step.choices ? "choices" : (step.output || "text"), v => {
      if (v === "choices") { step.choices = step.choices || ["yes","no"]; delete step.output; }
      else { delete step.choices; step.output = v; }
      render();
    }, { select: ["text","json","choices"] }));
    row.appendChild(f("model override (optional)", step.model, v => step.model = v || undefined, { ph: "claude-sonnet-5" }));
    fields.appendChild(row);
    if (step.choices) {
      const ch = document.createElement("div");
      ch.className = "choices";
      ch.innerHTML = `<span class="diamond">◇ decision:</span>` + step.choices.map(c => `<span class="choice-chip">${esc(c)}</span>`).join("");
      const edit = f("", step.choices.join(" | "), v => { step.choices = v.split("|").map(s=>s.trim()).filter(Boolean); render(); });
      edit.style.flex = "1";
      ch.appendChild(edit);
      fields.appendChild(ch);
    }
  }
  if (step.do === "foreach") {
    fields.appendChild(f("items (a JSON-array variable)", step.items, v => step.items = v));
    fields.appendChild(f("loop variable", step.as || "item", v => step.as = v));
    fields.appendChild(f("max iterations", step.max_iterations ?? 100, v => step.max_iterations = parseInt(v) || 100));
  }
  const common = document.createElement("div");
  common.className = "fields";
  common.appendChild(f("on failure", step.on_fail || "abort", v => step.on_fail = v === "abort" ? undefined : v,
    { select: ["abort","continue","next_item"] }));
  common.appendChild(f("timeout ms", step.timeout_ms ?? "", v => step.timeout_ms = v ? parseInt(v) : undefined));
  fields.appendChild(common);
  card.appendChild(fields);

  if (step.do === "foreach") {
    step.steps = step.steps || [];
    const kids = document.createElement("div");
    kids.className = "kids";
    kids.appendChild(renderRange(step.steps, 0, step.steps.length));
    card.appendChild(kids);
  }
  return card;
}

// ---------- actions ----------

async function save() {
  if (!FILE || !PB) return;
  const res = await fetch(`/api/playbook?f=${encodeURIComponent(FILE)}`, {
    method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(PB),
  });
  const out = await res.json();
  if (out.ok) { AUTO_STAGED = false; toast("✓ saved (schema valid)"); loadLibrary(true); render(); }
  else toast("✗ " + (out.issues ? out.issues.map(i=>i.message).join("; ") : out.error), 6000);
}

async function describe() {
  if (!FILE || !PB) return;
  const btn = document.getElementById("btn-desc");
  btn.disabled = true; btn.textContent = "✨ describing…";
  try {
    const res = await fetch("/api/annotate", {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(PB),
    });
    const out = await res.json();
    if (out.ok) {
      PB.description = out.description;
      PB.stages = out.stages;
      AUTO_STAGED = false;
      render();
      toast("✓ described — review the boxes, then Save");
    } else toast("✗ " + out.error, 6000);
  } catch (e) { toast("✗ " + e, 5000); }
  btn.disabled = false; btn.textContent = "✨ Describe";
}

function openDrawer(mode) {
  document.getElementById("drawer").classList.add("open");
  document.getElementById("console").style.display = mode === "console" ? "block" : "none";
  document.getElementById("history").style.display = mode === "history" ? "block" : "none";
  document.getElementById("d-title").textContent = mode;
}
function closeDrawer() { document.getElementById("drawer").classList.remove("open"); }

async function run() {
  if (!FILE) return;
  openDrawer("console");
  const con = document.getElementById("console");
  con.textContent = "▶ running " + FILE + " — hands off the machine…\n";
  const res = await fetch(`/api/run?f=${encodeURIComponent(FILE)}`, { method: "POST" });
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    con.textContent += dec.decode(value);
    con.scrollTop = con.scrollHeight;
  }
  loadLibrary(true);
}

async function history() {
  if (!PB) return;
  openDrawer("history");
  const h = document.getElementById("history");
  const runs = await (await fetch(`/api/runs?name=${encodeURIComponent(PB.playbook)}`)).json();
  h.innerHTML = runs.length ? "" : "<div style='color:var(--dim)'>no runs yet</div>";
  for (const r of runs) {
    const row = document.createElement("div");
    row.className = "runrow";
    row.innerHTML = `<span class="dot ${r.result==="ok"?"ok":"fail"}"></span>
      <span class="mono">${esc(r.started)}</span><span>${r.steps} steps</span><span>${r.result}</span>`;
    row.onclick = async () => {
      const rep = await (await fetch(`/api/report?f=${encodeURIComponent(r.file)}`)).json();
      const con = document.getElementById("console");
      openDrawer("console");
      con.textContent = (rep.stopped_early ? "⏹ stopped early — nothing to do\n\n" : "") + rep.steps.map(s =>
        `${s.status === "ok" ? "✓" : s.status === "skipped" ? "↷" : "✗"} ${s.id}  ${s.intent}${s.strategy ? "  ["+s.strategy+"]" : ""}${s.detail ? "\n    " + s.detail : ""}${s.error ? "\n    ERROR: " + s.error : ""}`
      ).join("\n");
    };
    h.appendChild(row);
  }
}

document.getElementById("btn-save").onclick = save;
document.getElementById("btn-run").onclick = run;
document.getElementById("btn-hist").onclick = history;
document.getElementById("btn-desc").onclick = describe;
document.getElementById("v-flow").onclick = () => { VIEW = "flow"; render(); };
document.getElementById("v-bricks").onclick = () => { VIEW = "bricks"; render(); };
loadLibrary();
</script>
